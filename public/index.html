<script>
document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('form-intencion'); // Asegúrate que el <form> tenga id="form-intencion"

    if (form) {
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                nombre: document.getElementById('nombre').value,
                tipo: document.getElementById('tipo').value,
                descripcion: document.getElementById('descripcion').value,
                fecha: document.getElementById('fecha').value
            };

            try {
                // Usamos la ruta relativa "/api/intenciones"
                const res = await fetch('/api/intenciones', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok) {
                    alert('¡Intención registrada con éxito!');
                    form.reset();
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                console.error('Error de red:', err);
                alert('No se pudo conectar con el servidor.');
            }
        });
    }
});
</script>
