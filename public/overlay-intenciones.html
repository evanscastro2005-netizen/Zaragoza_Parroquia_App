<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Intenciones de la Santa Misa</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body {
      background: transparent !important;
      margin: 0;
      padding: 0;
      overflow: hidden;
      color: #fff;
      font-family: Georgia, "Times New Roman", serif;
    }
    body.preview { background: radial-gradient(circle at 50% 20%, #59636e 0, #252a31 58%, #111318 100%) !important; }
    body.preview::after { content: "VISTA PREVIA · En OBS el fondo será transparente"; position: fixed; top: 18px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,.68); font: 10px Arial, sans-serif; letter-spacing: .08em; }
    .overlay {
      position: fixed;
      right: 3.5vw;
      bottom: 4.5vh;
      width: min(720px, 92vw);
      padding: 18px 26px 20px;
      overflow: hidden;
      border: 1px solid #d8b15c;
      border-radius: 5px;
      background: rgba(24, 22, 22, .85);
      box-shadow: 0 5px 20px rgba(0, 0, 0, .42), inset 0 0 0 1px rgba(216, 177, 92, .12);
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .35s ease, transform .35s ease;
    }
    .overlay.visible { opacity: 1; transform: translateY(0); }
    .heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 11px;
      color: #e5c77c;
      font-size: clamp(16px, 1.7vw, 25px);
      font-weight: 700;
      letter-spacing: .08em;
      line-height: 1.15;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, .8);
    }
    .heading::before { content: "✦"; color: #f0d58a; font-size: .85em; }
    .list { margin: 0; padding: 0; list-style: none; }
    .intention {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 10px;
      padding: 8px 0;
      border-top: 1px solid rgba(216, 177, 92, .35);
      font-size: clamp(17px, 2vw, 29px);
      line-height: 1.22;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, .8);
    }
    .intention::before { content: "•"; color: #e5c77c; }
    .type { display: block; margin-top: 3px; color: #e5c77c; font: 600 clamp(11px, 1.1vw, 15px)/1.2 Arial, sans-serif; letter-spacing: .04em; text-transform: uppercase; }
    .empty { color: #eee; font-size: clamp(16px, 1.6vw, 22px); }
    .status { margin-top: 10px; color: rgba(255,255,255,.58); font: 10px Arial, sans-serif; letter-spacing: .05em; }
    @media (max-width: 650px) { .overlay { right: 2vw; bottom: 3vh; padding: 14px 17px; } }
  </style>
</head>
<body>
  <section class="overlay" id="overlay" aria-live="polite">
    <h1 class="heading">INTENCIONES DE LA SANTA MISA</h1>
    <ul class="list" id="lista"><li class="empty">Cargando intenciones...</li></ul>
    <div class="status" id="estado">Actualización automática activa</div>
  </section>
  <script>
    (() => {
      const caja = document.getElementById('overlay');
      const lista = document.getElementById('lista');
      const estado = document.getElementById('estado');
      const params = new URLSearchParams(location.search);
      const esVistaPrevia = params.get('preview') === '1';
      if (esVistaPrevia) document.body.classList.add('preview');
      const url = `/api/overlay/intenciones${params.has('fecha') ? `?fecha=${encodeURIComponent(params.get('fecha'))}` : ''}`;
      const escapar = valor => String(valor ?? '').replace(/[&<>"']/g, caracter => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[caracter]));
      let firma = '';

      async function actualizar() {
        try {
          const respuesta = await fetch(url, { cache: 'no-store' });
          if (!respuesta.ok) throw new Error('Respuesta no disponible');
          const resultado = await respuesta.json();
          const intenciones = Array.isArray(resultado.data) ? resultado.data : [];
          const nuevaFirma = JSON.stringify(intenciones);
          if (nuevaFirma !== firma) {
            firma = nuevaFirma;
            lista.innerHTML = intenciones.length
              ? intenciones.map(item => `<li class="intention"><div>${escapar(item.nombre)}<span class="type">${escapar(item.tipo || 'Intención')}</span></div></li>`).join('')
              : '<li class="empty">No hay intenciones registradas para la Misa de hoy.</li>';
            caja.classList.toggle('visible', intenciones.length > 0 || esVistaPrevia);
          }
          estado.textContent = `Misa del ${resultado.fecha} · Actualización automática activa`;
        } catch (error) {
          estado.textContent = 'Esperando conexión con el servidor…';
        }
      }

      actualizar();
      setInterval(actualizar, 7000);
    })();
  </script>
</body>
</html>
