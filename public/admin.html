<script>
document.addEventListener('DOMContentLoaded', async () => {
    const contenedor = document.getElementById('lista-intenciones'); // Asegúrate de tener un div con id="lista-intenciones"

    async function cargarIntenciones() {
        if (!contenedor) return;
        try {
            // Petición a la ruta relativa
            const res = await fetch('/api/intenciones');
            const intenciones = await res.json();

            contenedor.innerHTML = '';
            if (intenciones.length === 0) {
                contenedor.innerHTML = '<p>No hay intenciones registradas.</p>';
                return;
            }

            intenciones.forEach(item => {
                const card = document.createElement('div');
                card.className = 'tarjeta-intencion';
                card.innerHTML = `
                    <h3>${item.nombre}</h3>
                    <p><strong>Tipo:</strong> ${item.tipo}</p>
                    <p><strong>Fecha:</strong> ${item.fecha || 'Sin fecha'}</p>
                    <p><strong>Detalle:</strong> ${item.descripcion}</p>
                    <hr>
                `;
                contenedor.appendChild(card);
            });
        } catch (err) {
            console.error('Error al cargar intenciones:', err);
            if (contenedor) contenedor.innerHTML = '<p>Error al obtener los datos.</p>';
        }
    }

    cargarIntenciones();
});
</script>
